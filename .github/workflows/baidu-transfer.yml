name: Baidu Transfer Task

on:
  schedule:
    # 每六小时执行一次 (UTC时间)
    - cron: '17 */6 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read

concurrency:
  group: baidu-transfer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTIONS: 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          constraints.txt

    - name: Install dependencies
      run: bash scripts/install_dependencies.sh runtime

    - name: Check encrypted failed state key
      id: failed_state
      env:
        TRANSFERSHARE_STATE_KEY: ${{ secrets.TRANSFERSHARE_STATE_KEY }}
      run: |
        if [ -n "$TRANSFERSHARE_STATE_KEY" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "TRANSFERSHARE_STATE_KEY 未配置，跳过跨 run 失败清单持久化"
        fi

    - name: Restore encrypted failed state
      if: steps.failed_state.outputs.enabled == 'true'
      uses: actions/cache/restore@v4
      with:
        path: .transfershare_failed_transfers.json.enc
        key: transfershare-failed-state-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          transfershare-failed-state-${{ github.ref_name }}-

    - name: Decrypt failed state
      if: steps.failed_state.outputs.enabled == 'true' && hashFiles('.transfershare_failed_transfers.json.enc') != ''
      env:
        TRANSFERSHARE_STATE_KEY: ${{ secrets.TRANSFERSHARE_STATE_KEY }}
      run: |
        set -euo pipefail
        key_file="$(mktemp)"
        trap 'rm -f "$key_file"' EXIT
        printf '%s' "$TRANSFERSHARE_STATE_KEY" > "$key_file"
        chmod 600 "$key_file"
        if openssl enc -d -aes-256-cbc -pbkdf2 \
          -in .transfershare_failed_transfers.json.enc \
          -out .transfershare_failed_transfers.json \
          -pass file:"$key_file"; then
          chmod 600 .transfershare_failed_transfers.json
          echo "已恢复加密失败清单"
        else
          rm -f .transfershare_failed_transfers.json
          echo "无法解密失败清单，跳过历史状态"
        fi

    - name: Run transfer task (First attempt)
      id: first_attempt
      timeout-minutes: 7
      continue-on-error: true
      env:
        BAIDU_COOKIES: ${{ secrets.BAIDU_COOKIES }}
        SHARE_URLS: ${{ secrets.SHARE_URLS }}
        SAVE_DIR: ${{ secrets.SAVE_DIR }}
        WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
      run: |
        echo "开始执行转存任务 (第一次尝试)"
        echo "超时时间: 7 分钟"
        echo "========================================"
        ./scripts/run_transfer_task.sh

    - name: Run transfer task (Second attempt)
      if: steps.first_attempt.outcome == 'failure'
      timeout-minutes: 10
      env:
        BAIDU_COOKIES: ${{ secrets.BAIDU_COOKIES }}
        SHARE_URLS: ${{ secrets.SHARE_URLS }}
        SAVE_DIR: ${{ secrets.SAVE_DIR }}
        WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
      run: |
        echo "第一次尝试失败，开始第二次尝试"
        echo "超时时间: 10 分钟"
        echo "========================================"
        sleep 5
        ./scripts/run_transfer_task.sh

    - name: Encrypt failed state
      if: always() && steps.failed_state.outputs.enabled == 'true'
      env:
        TRANSFERSHARE_STATE_KEY: ${{ secrets.TRANSFERSHARE_STATE_KEY }}
      run: |
        set -euo pipefail
        key_file="$(mktemp)"
        state_file=".transfershare_failed_transfers.json"
        encrypted_file=".transfershare_failed_transfers.json.enc"
        tmp_state="$(mktemp)"
        tmp_encrypted="$(mktemp)"
        trap 'rm -f "$key_file" "$tmp_state" "$tmp_encrypted"' EXIT
        printf '%s' "$TRANSFERSHARE_STATE_KEY" > "$key_file"
        chmod 600 "$key_file"
        if [ -s "$state_file" ]; then
          cp "$state_file" "$tmp_state"
        else
          printf '[]\n' > "$tmp_state"
        fi
        openssl enc -aes-256-cbc -salt -pbkdf2 \
          -in "$tmp_state" \
          -out "$tmp_encrypted" \
          -pass file:"$key_file"
        mv "$tmp_encrypted" "$encrypted_file"
        chmod 600 "$encrypted_file"
        rm -f "$state_file"

    - name: Save encrypted failed state
      if: always() && steps.failed_state.outputs.enabled == 'true'
      uses: actions/cache/save@v4
      with:
        path: .transfershare_failed_transfers.json.enc
        key: transfershare-failed-state-${{ github.ref_name }}-${{ github.run_id }}
