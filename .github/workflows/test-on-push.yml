name: Run Tests On Push

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Lint GitHub Actions workflows
      uses: rhysd/actionlint@v1

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-test.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-test.txt

    - name: Build BaiduPCS-Py submodule
      run: |
        ./scripts/build_baidupcs_submodule.sh
        PYTHONPATH="$PWD/vendor/BaiduPCS-Py" python -c "from baidupcs_py.baidupcs import BaiduPCSApi"

    - name: Run tests
      run: |
        python -m unittest discover -s tests -p "test_*.py" -b
