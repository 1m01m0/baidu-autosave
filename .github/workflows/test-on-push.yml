name: Run Tests On Push

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Lint GitHub Actions workflows
      uses: rhysd/actionlint@v1

  quality-security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-test.txt
          requirements-quality.txt
          constraints.txt

    - name: Install dependencies
      run: bash scripts/install_dependencies.sh quality

    - name: Run quality and security checks
      run: |
        python -m compileall -q -x 'vendor/' .
        python -m ruff check .
        python -m ruff format --check .
        python -m pip check
        python -m pip_audit -r requirements.txt -r requirements-test.txt -r requirements-quality.txt

  dependency-lock:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-test.txt
          requirements-quality.txt
          constraints.txt

    - name: Install dependencies
      run: bash scripts/install_dependencies.sh quality

    - name: Check dependency lock
      run: python scripts/check_dependency_lock.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-test.txt
          constraints.txt

    - name: Install dependencies
      run: bash scripts/install_dependencies.sh test

    - name: Resolve BaiduPCS-Py submodule SHA
      id: submodule
      run: |
        sha=$(git -C vendor/BaiduPCS-Py rev-parse HEAD)
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - name: Cache BaiduPCS-Py Cython artifacts
      uses: actions/cache@v4
      with:
        path: vendor/BaiduPCS-Py/baidupcs_py/common/*.so
        key: baidupcs-cython-${{ runner.os }}-py${{ matrix.python-version }}-${{ steps.submodule.outputs.sha }}

    - name: Build BaiduPCS-Py submodule
      run: |
        ./scripts/build_baidupcs_submodule.sh
        PYTHONPATH="$PWD/vendor/BaiduPCS-Py" python -c "from baidupcs_py.baidupcs import BaiduPCSApi"

    - name: Run tests
      run: |
        python -m unittest discover -s tests -p "test_*.py" -b
